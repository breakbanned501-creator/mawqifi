# Manual-only: select ios-release-hardening in Codemagic.
# Create group mawqifi_testflight_staging with NEXT_PUBLIC_SUPABASE_URL,
# NEXT_PUBLIC_SUPABASE_ANON_KEY, NEXT_PUBLIC_SERVER_API_ORIGIN,
# NEXT_PUBLIC_REVERSE_MATCHING=1, and APP_STORE_APPLE_ID.
# Keep server-side Supabase, VAPID, and APNs credentials out of this group.
workflows:
  ios-testflight-staging:
    name: Mawqifi iOS TestFlight Staging
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: Mawqifi Codemagic
    environment:
      ios_signing:
        provisioning_profiles:
          - profile: mawqifi_app_store_push
            environment_variable: MAWQIFI_PROVISIONING_PROFILE_PATH
        certificates:
          - Mawqifi Codemagic
      groups:
        - mawqifi_testflight_staging
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      node: 22
      xcode: latest
    # No triggering section: pushing this file must not start an upload.
    scripts:
      - name: Verify release branch and staging-only configuration
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          APP_BASELINE=c27e34bd1d82a17345023948003f980f5acb18be
          test "$CM_BRANCH" = "codex/mawqifi-2-reverse-matching"
          test "$(git rev-parse HEAD^)" = "$APP_BASELINE"
          test "$(git diff --name-only "$APP_BASELINE"..HEAD)" = "codemagic.yaml"
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const env = process.env;
          const ref = 'jrmiwmsgnztqwbigumlw';
          assert.equal(env.NEXT_PUBLIC_REVERSE_MATCHING, '1', 'Reverse matching must be enabled for this staging build');
          assert.equal(env.NEXT_PUBLIC_SUPABASE_URL, 'https://' + ref + '.supabase.co', 'Expected staging Supabase URL');
          assert.equal(env.NEXT_PUBLIC_SERVER_API_ORIGIN, 'https://mawqifi-testflight-staging.vercel.app', 'Expected staging API origin');
          assert(/^[0-9]+$/.test(env.APP_STORE_APPLE_ID || ''), 'Set the numeric App Store Connect Apple ID');
          assert(!env.MAWQIFI_NATIVE_ENV_FILE, 'Native env-file overrides are not allowed in staging CI');
          for (const name of ['SUPABASE_SERVICE_ROLE_KEY', 'VAPID_PRIVATE_KEY', 'APNS_PRIVATE_KEY', 'APNS_AUTH_KEY']) {
            assert(!env[name], name + ' must not be available to this native build');
          }
          const forbiddenRef = ['opsy', 'vdsivxoqphkfdsbb'].join('');
          assert(!Object.values(env).some(value => value.includes(forbiddenRef)), 'Production backend reference in build environment');
          assert(!fs.readdirSync('.').some(name => name !== '.env.example' && /^\.env(?:\.|$)/.test(name)), 'Local env files must not override CI configuration');
          const key = env.NEXT_PUBLIC_SUPABASE_ANON_KEY || '';
          if (key.startsWith('eyJ')) {
            const payload = JSON.parse(Buffer.from(key.split('.')[1], 'base64url').toString());
            assert.equal(payload.ref, ref, 'Public key must belong to staging');
            assert.equal(payload.role, 'anon', 'Only an anon key may be bundled');
          } else {
            assert(key.startsWith('sb_publishable_'), 'Expected a staging anon/publishable key');
          }
          // Validate against staging Auth without creating users or logging values.
          (async () => {
            const response = await fetch(env.NEXT_PUBLIC_SUPABASE_URL + '/auth/v1/settings', {
              headers: { apikey: key },
            });
            assert.equal(response.status, 200, 'Staging public key failed validation');
            console.log('Staging-only public build configuration verified.');
          })().catch(() => {
            console.error('Staging public-key validation failed.');
            process.exitCode = 1;
          });
          NODE
      - name: Install locked dependencies
        script: npm ci
      - name: Typecheck
        script: npm run typecheck
      - name: Lint
        script: npm run lint
      - name: Build and verify local Capacitor assets
        # Includes cap sync ios and verify-native-archive; no second sync needed.
        script: npm run cap:ios:archive
      - name: Prepare the Swift Package Manager workspace
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          # Capacitor 8 uses SPM here, so there is no CocoaPods-generated workspace.
          if [ ! -d "$XCODE_WORKSPACE" ]; then
            mkdir -p "$XCODE_WORKSPACE"
            cat > "$XCODE_WORKSPACE/contents.xcworkspacedata" <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <Workspace version="1.0">
            <FileRef location="group:App.xcodeproj"/>
          </Workspace>
          XML
          fi
          # Share the existing App target's scheme for headless workspace archives.
          ruby <<'RUBY'
          require 'xcodeproj'
          project_path = 'ios/App/App.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          target = project.targets.find { |item| item.name == 'App' }
          abort 'Missing App target' unless target
          scheme = Xcodeproj::XCScheme.new
          scheme.configure_with_targets(target, nil, launch_target: true)
          scheme.save_as(project_path, 'App', true)
          RUBY
      - name: Apply existing App Store provisioning profiles
        # The explicit push-enabled profile is decoded before Xcode assignment.
        # Internal-only exports cannot be distributed externally or to customers.
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          PROFILE_PLIST=$(mktemp)
          trap 'rm -f "$PROFILE_PLIST"' EXIT
          security cms -D -i "$MAWQIFI_PROVISIONING_PROFILE_PATH" > "$PROFILE_PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$PROFILE_PLIST")" = "production"
          APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")
          [[ "$APP_IDENTIFIER" = *.com.mawqifi.app ]]
          echo "Push-enabled App Store profile verified for com.mawqifi.app."
          xcode-project use-profiles \
            --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Select an incrementing TestFlight build number
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          # Fail on API/auth errors; only a successful empty result means no prior build.
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID")
          if [ -z "$LATEST_BUILD_NUMBER" ]; then LATEST_BUILD_NUMBER=0; fi
          CI_BUILD_NUMBER="$PROJECT_BUILD_NUMBER"
          [[ "$LATEST_BUILD_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$CI_BUILD_NUMBER" =~ ^[0-9]+$ ]]
          IOS_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          if (( CI_BUILD_NUMBER > IOS_BUILD_NUMBER )); then
            IOS_BUILD_NUMBER="$CI_BUILD_NUMBER"
          fi
          echo "IOS_BUILD_NUMBER=$IOS_BUILD_NUMBER" >> "$CM_ENV"
          echo "Using iOS build number $IOS_BUILD_NUMBER; marketing version remains 1.0.1."
      - name: Build signed App Store IPA
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --no-show-build-settings \
            --archive-xcargs "COMPILER_INDEX_STORE_ENABLE=NO MARKETING_VERSION=1.0.2 CURRENT_PROJECT_VERSION=$IOS_BUILD_NUMBER" \
            --ipa-directory "$CM_BUILD_DIR/build/ios/ipa"
      - name: Verify signed staging IPA isolation and entitlements
        script: |-
          #!/usr/bin/env bash
          set -euo pipefail
          shopt -s nullglob
          IPAS=("$CM_BUILD_DIR"/build/ios/ipa/*.ipa)
          test "${#IPAS[@]}" -eq 1
          SCAN_DIR="$CM_BUILD_DIR/build/staging-ipa-scan"
          rm -rf "$SCAN_DIR"
          mkdir -p "$SCAN_DIR"
          unzip -q "${IPAS[0]}" -d "$SCAN_DIR"
          APPS=("$SCAN_DIR"/Payload/*.app)
          test "${#APPS[@]}" -eq 1
          APP="${APPS[0]}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "com.mawqifi.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "1.0.2"
          SIGNED_ENTITLEMENTS="$SCAN_DIR/signed-entitlements.plist"
          PROFILE_PLIST="$SCAN_DIR/profile.plist"
          codesign -d --entitlements :- "$APP" > "$SIGNED_ENTITLEMENTS" 2>/dev/null
          security cms -D -i "$APP/embedded.mobileprovision" > "$PROFILE_PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$SIGNED_ENTITLEMENTS")" = "production"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$PROFILE_PLIST")" = "production"
          APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")
          [[ "$APP_IDENTIFIER" = *.com.mawqifi.app ]]
          grep -R -a -q 'jrmiwmsgnztqwbigumlw' "$APP"
          grep -R -a -q 'mawqifi-testflight-staging.vercel.app' "$APP"
          if grep -R -a -E -q 'opsyvdsivxoqphkfdsbb|SUPABASE_SERVICE_ROLE_KEY|APNS_PRIVATE_KEY|APNS_AUTH_KEY|VAPID_PRIVATE_KEY' "$APP"; then
            echo "Forbidden production reference or server-only credential marker found in staging archive." >&2
            exit 1
          fi
          echo "Signed staging IPA bundle, APNs entitlement, backend isolation, and secret-marker scan passed."
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/ios/xcarchive/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        # Upload for internal TestFlight; this switch means EXTERNAL beta review.
        submit_to_testflight: false
        submit_to_app_store: false

  # Manual only. Final approval must supply APPROVED_RELEASE_COMMIT and APPROVED_RELEASE_TAG.
  # Dedicated public build group: mawqifi_app_store_production. No server/APNs secrets.
  ios-app-store-production:
    name: Mawqifi iOS Production App Store (Manual Approval)
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: Mawqifi Codemagic
    environment:
      ios_signing:
        provisioning_profiles:
          - profile: mawqifi_app_store_push
            environment_variable: MAWQIFI_PROVISIONING_PROFILE_PATH
        certificates:
          - Mawqifi Codemagic
      groups:
        - mawqifi_app_store_production
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        NEXT_PUBLIC_REVERSE_MATCHING: 1
      node: 22
      xcode: latest
    scripts:
      - name: Verify final approved production commit/tag and public configuration
        script: |-
          #!/usr/bin/env bash
          set -euo pipefail
          [[ "${APPROVED_RELEASE_TAG:-}" =~ ^mawqifi-production-[A-Za-z0-9._-]+$ ]]
          # Tag-triggered builds may not populate CM_BRANCH. The Node guard accepts
          # only the release branch or CM_TAG matching this exact approved tag.
          # Always fetch into a dedicated ref so a stale local tag cannot be trusted.
          # Disabling every credential path prevents macOS Keychain prompts in CI.
          GIT_TERMINAL_PROMPT=0 git -c credential.helper= -c core.askPass= fetch --no-tags \
            https://github.com/breakbanned501-creator/mawqifi.git \
            "+refs/tags/$APPROVED_RELEASE_TAG:refs/codemagic/approved-release-tag"
          node scripts/verify-production-build-env.cjs
          # Read-only public key check, no user creation or configuration mutation.
          node <<'NODE'
          (async()=>{
           const r=await fetch(process.env.NEXT_PUBLIC_SUPABASE_URL+'/auth/v1/settings',{headers:{apikey:process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY},signal:AbortSignal.timeout(15000)});
           if(r.status!==200)throw Error('validation failed');
           console.log('Production public key accepted by approved Auth endpoint.');
          })().catch(()=>{console.error('Production public key validation failed.');process.exitCode=1;});
          NODE
      - name: Install locked dependencies
        script: npm ci
      - name: Typecheck
        script: npm run typecheck
      - name: Lint
        script: npm run lint
      - name: Build and verify local Capacitor assets
        script: npm run cap:ios:archive
      - name: Prepare the Swift Package Manager workspace
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          # Capacitor 8 uses SPM here, so there is no CocoaPods-generated workspace.
          if [ ! -d "$XCODE_WORKSPACE" ]; then
            mkdir -p "$XCODE_WORKSPACE"
            cat > "$XCODE_WORKSPACE/contents.xcworkspacedata" <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <Workspace version="1.0">
            <FileRef location="group:App.xcodeproj"/>
          </Workspace>
          XML
          fi
          # Share the existing App target's scheme for headless workspace archives.
          ruby <<'RUBY'
          require 'xcodeproj'
          project_path = 'ios/App/App.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          target = project.targets.find { |item| item.name == 'App' }
          abort 'Missing App target' unless target
          scheme = Xcodeproj::XCScheme.new
          scheme.configure_with_targets(target, nil, launch_target: true)
          scheme.save_as(project_path, 'App', true)
          RUBY
      - name: Verify and apply production push provisioning profile
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          PROFILE_PLIST=$(mktemp)
          trap 'rm -f "$PROFILE_PLIST"' EXIT
          security cms -D -i "$MAWQIFI_PROVISIONING_PROFILE_PATH" > "$PROFILE_PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$PROFILE_PLIST")" = "production"
          APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")
          [[ "$APP_IDENTIFIER" = *.com.mawqifi.app ]]
          echo "Provisioning profile authorizes production APNs for com.mawqifi.app."
          xcode-project use-profiles \
      - name: Select an incrementing App Store build number
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          # Fail on API/auth errors; only a successful empty result means no prior build.
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID")
          if [ -z "$LATEST_BUILD_NUMBER" ]; then LATEST_BUILD_NUMBER=0; fi
          CI_BUILD_NUMBER="$PROJECT_BUILD_NUMBER"
          [[ "$LATEST_BUILD_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$CI_BUILD_NUMBER" =~ ^[0-9]+$ ]]
          IOS_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          if (( CI_BUILD_NUMBER > IOS_BUILD_NUMBER )); then
            IOS_BUILD_NUMBER="$CI_BUILD_NUMBER"
          fi
          echo "IOS_BUILD_NUMBER=$IOS_BUILD_NUMBER" >> "$CM_ENV"
          echo "Using iOS build number $IOS_BUILD_NUMBER; marketing version is 1.0.2."
      - name: Build signed App Store IPA
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --no-show-build-settings \
            --archive-xcargs "COMPILER_INDEX_STORE_ENABLE=NO MARKETING_VERSION=1.0.2 CURRENT_PROJECT_VERSION=$IOS_BUILD_NUMBER" \
            --ipa-directory "$CM_BUILD_DIR/build/ios/ipa"
      - name: Scan expanded signed IPA and local assets before upload
        script: |-
          #!/usr/bin/env bash
          set -euo pipefail
          shopt -s nullglob
          IPAS=("$CM_BUILD_DIR"/build/ios/ipa/*.ipa)
          test "${#IPAS[@]}" -eq 1
          mkdir -p "$CM_BUILD_DIR/build/production-ipa-scan"
          unzip -q "${IPAS[0]}" -d "$CM_BUILD_DIR/build/production-ipa-scan"
          APPS=("$CM_BUILD_DIR"/build/production-ipa-scan/Payload/*.app)
          test "${#APPS[@]}" -eq 1
          SIGNED_ENTITLEMENTS="$CM_BUILD_DIR/build/production-ipa-scan/signed-entitlements.plist"
          PROFILE_PLIST="$CM_BUILD_DIR/build/production-ipa-scan/profile.plist"
          codesign -d --entitlements :- "${APPS[0]}" > "$SIGNED_ENTITLEMENTS" 2>/dev/null
          security cms -D -i "${APPS[0]}/embedded.mobileprovision" > "$PROFILE_PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$SIGNED_ENTITLEMENTS")" = "production"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$PROFILE_PLIST")" = "production"
          APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")
          [[ "$APP_IDENTIFIER" = *.com.mawqifi.app ]]
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${APPS[0]}/Info.plist")" = "1.0.2"
          echo "Signed archive and provisioning profile contain production APNs entitlement."
          test "$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:0' "${APPS[0]}/Info.plist")" = "1"
          if /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:1' "${APPS[0]}/Info.plist" >/dev/null 2>&1; then
            echo "Signed archive unexpectedly declares a second device family." >&2
            exit 1
          fi
          echo "Signed archive declares iPhone-only UIDeviceFamily [1]."
          node scripts/scan-production-archive.cjs "${APPS[0]}" "$CM_BUILD_DIR/out"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/ios/xcarchive/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
